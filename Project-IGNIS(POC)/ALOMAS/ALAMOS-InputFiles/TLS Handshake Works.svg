<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentstyletype="text/css" data-diagram-type="SEQUENCE" preserveAspectRatio="xMidYMid meet" version="1.1" viewBox="0 0 582 820" zoomAndPan="magnify"><title>TLS Handshake — Certificate Selection Timing (Adapter)</title><defs></defs><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="445.6758" x="56.509" y="27.9951">TLS Handshake — Certificate Selection Timing (Adapter)</text><g><title>Client</title><rect fill="#000000" fill-opacity="0.00000" height="572.6563" width="8" x="75.9585" y="134.8906"></rect><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="79" x2="79" y1="134.8906" y2="707.5469"></line></g><g><title>Server</title><rect fill="#000000" fill-opacity="0.00000" height="572.6563" width="8" x="420.4136" y="134.8906"></rect><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="424.0576" x2="424.0576" y1="134.8906" y2="707.5469"></line></g><g class="participant participant-head" data-participant="Client"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.5303" x="56.6934" y="115.292">Client</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.917" x="5" y="131.5889">(IPL / UCRI / Partner)</text><ellipse cx="79.9585" cy="50.7969" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"></ellipse><path d="M79.9585,58.7969 L79.9585,85.7969 M66.9585,66.7969 L92.9585,66.7969 M79.9585,85.7969 L66.9585,100.7969 M79.9585,85.7969 L92.9585,100.7969" fill="none" style="stroke:#181818;stroke-width:0.5;"></path></g><g class="participant participant-tail" data-participant="Client"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.5303" x="56.6934" y="719.542">Client</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.917" x="5" y="735.8389">(IPL / UCRI / Partner)</text><ellipse cx="79.9585" cy="747.6406" fill="#E2E2F0" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"></ellipse><path d="M79.9585,755.6406 L79.9585,782.6406 M66.9585,763.6406 L92.9585,763.6406 M79.9585,782.6406 L66.9585,797.6406 M79.9585,782.6406 L92.9585,797.6406" fill="none" style="stroke:#181818;stroke-width:0.5;"></path></g><g class="participant participant-head" data-participant="Server"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.7119" x="384.0576" y="87.2969"></rect><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.9102" x="401.4585" y="107.292">Server</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.7119" x="391.0576" y="123.5889">(Adapter)</text></g><g class="participant participant-tail" data-participant="Server"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="80.7119" x="384.0576" y="706.5469"></rect><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="45.9102" x="401.4585" y="726.542">Server</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="66.7119" x="391.0576" y="742.8389">(Adapter)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="559.6938" x="0" y="165.457"></rect><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="165.457" y2="165.457"></line><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="168.457" y2="168.457"></line><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="151.8584" x="203.9177" y="154.8906"></rect><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="133.3325" x="209.9177" y="170.9575">1. TCP Connection</text><g class="message" data-participant-1="Client" data-participant-2="Server"><polygon fill="#181818" points="412.4136,205.1563,422.4136,209.1563,412.4136,213.1563,416.4136,209.1563" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="79.9585" x2="418.4136" y1="209.1563" y2="209.1563"></line><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.3213" x="162.5254" y="204.0903">TCP connection established</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="559.6938" x="0" y="237.7227"></rect><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="237.7227" y2="237.7227"></line><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="240.7227" y2="240.7227"></line><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="117.3145" x="221.1897" y="227.1563"></rect><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="98.7886" x="227.1897" y="243.2231">2. ClientHello</text><g class="message" data-participant-1="Client" data-participant-2="Server"><polygon fill="#181818" points="412.4136,292.5547,422.4136,296.5547,412.4136,300.5547,416.4136,296.5547" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="79.9585" x2="418.4136" y1="296.5547" y2="296.5547"></line><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.5859" x="216.8931" y="276.356">ClientHello</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.647" x="120.8625" y="291.4888">(TLS version, cipher suites, SNI?, ALPN?)</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="559.6938" x="0" y="325.1211"></rect><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="325.1211" y2="325.1211"></line><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="328.1211" y2="328.1211"></line><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="272.6924" x="143.5007" y="314.5547"></rect><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="254.1665" x="149.5007" y="330.6216">3. ServerHello + Server Certificate</text><path d="M294,352.6875 L294,422.6875 L554,422.6875 L554,362.6875 L544,352.6875 L294,352.6875" fill="#FFE0B2" style="stroke:#181818;stroke-width:0.5;"></path><path d="M544,352.6875 L544,362.6875 L554,362.6875 L544,352.6875" fill="#FFE0B2" style="stroke:#181818;stroke-width:0.5;"></path><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.8105" x="300" y="369.7544">Server MUST pick and send the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.1504" x="300" y="384.8872">SERVER CERTIFICATE here —</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.6938" x="300" y="400.02">only port / IP / SNI / ALPN are known.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.1016" x="300" y="415.1528">No HTTP data is available yet.</text><g class="message" data-participant-1="Server" data-participant-2="Client"><polygon fill="#181818" points="90.9585,445.3516,80.9585,449.3516,90.9585,453.3516,86.9585,449.3516" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="84.9585" x2="423.4136" y1="449.3516" y2="449.3516"></line><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.6064" x="127.3499" y="444.2856">ServerHello +</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="154.9336" x="222.0886" y="444.2856">SERVER CERTIFICATE</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="559.6938" x="0" y="477.918"></rect><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="477.918" y2="477.918"></line><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="480.918" y2="480.918"></line><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="215.2651" x="172.2144" y="467.3516"></rect><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="196.7393" x="178.2144" y="483.4185">4. Key Exchange / Finished</text><g class="message" data-participant-1="Client" data-participant-2="Server"><polygon fill="#181818" points="90.9585,517.6172,80.9585,521.6172,90.9585,525.6172,86.9585,521.6172" style="stroke:#181818;stroke-width:1;"></polygon><polygon fill="#181818" points="412.4136,517.6172,422.4136,521.6172,412.4136,525.6172,416.4136,521.6172" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="84.9585" x2="418.4136" y1="521.6172" y2="521.6172"></line><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.4551" x="91.9585" y="516.5513">Key exchange / Finished — secure channel ready</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="559.6938" x="0" y="550.1836"></rect><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="550.1836" y2="550.1836"></line><line style="stroke:#000000;stroke-width:1;" x1="0" x2="559.6938" y1="553.1836" y2="553.1836"></line><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="139.8613" x="209.9163" y="539.6172"></rect><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="121.3354" x="215.9163" y="555.6841">5. HTTP Request</text><path d="M9,577.75 L9,647.75 L493,647.75 L493,587.75 L483,577.75 L9,577.75" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"></path><path d="M483,577.75 L483,587.75 L493,587.75 L483,577.75" fill="#C8E6C9" style="stroke:#181818;stroke-width:0.5;"></path><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.3413" x="109.3184" y="594.8169">ONLY NOW is the HTTP request available</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.1328" x="109.3184" y="609.9497">(method, URI, headers, body, auth token).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.5679" x="109.3184" y="625.0825">Business / caller identity is known too late</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.687" x="109.3184" y="640.2153">to influence the server certificate choice.</text><g class="message" data-participant-1="Client" data-participant-2="Server"><polygon fill="#181818" points="412.4136,685.5469,422.4136,689.5469,412.4136,693.5469,416.4136,689.5469" style="stroke:#181818;stroke-width:1;"></polygon><line style="stroke:#181818;stroke-width:1;" x1="79.9585" x2="418.4136" y1="689.5469" y2="689.5469"></line><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.3311" x="208.5205" y="669.3481">HTTP request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.0005" x="116.6858" y="684.481">(method, URI, headers, body, auth token)</text></g><!--SRC=[ZLDTRzCm57tthxWgBrl9mZu0mKIPsYXLetLTr6OW95uyvwwnwjeXTjVrZH_1B-INS9saMu0XyU98lYVdd7lkjPDE8MJJ1Koupct1LmW_l_-022idxwJW3c612eMJHaCcrr8luM2Oyz9XTSYONKbTyeglmUAt3Mg1LsWjN-9GoQK6WPfm7LI5jZJQxb4ZL6Oxh2gp1LTji0DCEHaGikJQfJpFlUpPSQS-CW_x-vDZnhXmfe9Uf2GfVjK7IJg5Lt0JpHFwU2vDTdl0BJGGLZxnGs-1rJrMzDk-iHhPt38s6C1925cKGcIqRgCO35Z314SVMoISro3n14Bh-